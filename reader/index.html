<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050605">
  <meta name="description" content="Read Human 2.0 one word at a time, at your pace.">
  <title>Human 2.0 · The Reader</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23050605'/%3E%3Cpath d='M32 10l4.5 17.5L54 32l-17.5 4.5L32 54l-4.5-17.5L10 32l17.5-4.5z' fill='%23baff39'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar chrome">
      <button class="brand plain-button" id="homeButton" type="button" aria-label="Open chapters"><span class="brand-mark">✳</span><span>Human <strong>2.0</strong></span></button>
      <span class="topbar-right"><a href="../">← THE BOOK</a><span class="tiny-star">✳</span><span class="edition-label">VISUAL EDITION</span></span>
    </header>

    <main class="stage">
      <div class="chapter-context chrome" id="chapterContext">
        <span id="partLabel">A quieter way to read</span>
        <h1 id="chapterTitle">Human 2.0</h1>
      </div>

      <button id="wordArea" class="word-area plain-button" type="button" aria-label="Play or pause reading">
        <span class="word" id="word" aria-live="off">Begin.</span>
      </button>

      <div class="intro-hint chrome" id="introHint">ONE WORD <span>·</span> A QUIET PLACE TO FOCUS</div>

      <div class="reader-controls chrome" id="readerControls">
        <div class="transport">
          <button class="icon-button" id="previousButton" type="button" aria-label="Previous word" title="Previous word · Left arrow">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.5 6 5.5 12l6 6M19 6l-6 6 6 6"/></svg>
          </button>
          <button class="play-button" id="playButton" type="button" aria-label="Play" title="Play or pause · Space">
            <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7z"/></svg>
          </button>
          <button class="icon-button" id="nextButton" type="button" aria-label="Next word" title="Next word · Right arrow">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 6 6 6-6 6m2-12 6 6-6 6"/></svg>
          </button>
        </div>
        <div class="speed-control">
          <label for="speedRange">PACE</label>
          <input id="speedRange" type="range" min="120" max="900" step="10" value="240" aria-label="Reading speed in words per minute">
          <output id="speedOutput" for="speedRange">240 <span>WPM</span></output>
        </div>
      </div>
    </main>

    <footer class="footer chrome">
      <button class="chapter-button plain-button" id="chaptersButton" type="button" aria-haspopup="dialog" aria-controls="chaptersDialog"><span class="chapter-button-star">✳</span> Chapters <span class="chevron">⌃</span></button>
      <div class="progress-area"><div class="progress-track" id="progressTrack" role="progressbar" aria-label="Chapter progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressFill"></div></div><span id="progressText">0%</span></div>
      <button class="next-chapter plain-button" id="nextChapterButton" type="button">Next chapter <span>↗</span></button>
    </footer>
  </div>

  <dialog id="chaptersDialog" aria-labelledby="dialogTitle">
    <div class="dialog-head"><div><p class="eyebrow">THE BOOK</p><h2 id="dialogTitle">Find your place<span>.</span></h2></div><button class="close-button" id="closeDialog" type="button" aria-label="Close chapters">×</button></div>
    <p class="dialog-subtitle">Two or three middle letters guide the eye. The whole word stays centered as you read.</p>
    <div id="chapterList" class="chapter-list"></div>
    <div class="dialog-foot"><span>✳</span> Space to play or pause · Arrows to move word by word</div>
  </dialog>
  <noscript>This reader needs JavaScript to display the book.</noscript>
</body>
</html>
