name: Reader audio

on:
  workflow_dispatch:
    inputs:
      chapter:
        description: Chapter ID, or all
        required: true
        default: all
      limit_segments:
        description: Optional segment limit for a smoke test
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Grok narration and word timing
        run: |
          python3 -m pip install --quiet requests mutagen imageio-ffmpeg
          args=(--chapter "$CHAPTER")
          if [[ -n "$LIMIT_SEGMENTS" ]]; then args+=(--limit-segments "$LIMIT_SEGMENTS"); fi
          python3 reader/generate_audio.py "${args[@]}"
        env:
          CHAPTER: ${{ inputs.chapter }}
          LIMIT_SEGMENTS: ${{ inputs.limit_segments }}
      - name: Publish generated audio
        if: always()
        run: |
          if [[ ! -d reader/audio ]]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reader/audio
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Gemini reader audio'
            git push origin HEAD:main
          fi
